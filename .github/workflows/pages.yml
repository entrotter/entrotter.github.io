name: Publish OSS documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Audit all installed development dependencies
        run: |
          mkdir -p output/playwright
          npm audit --json > output/playwright/npm-audit.json
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: accessibility-evidence
          path: output/playwright/
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install integrity-locked Node and hash-locked Python development tools
        run: |
          npm ci --ignore-scripts
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements-quality.txt
          .venv/bin/python -m pip check
      - name: Check all JavaScript and declared browser tool types
        run: |
          set -euo pipefail
          mkdir -p .quality
          npm run lint
          npm run format:check
          npm run typecheck | tee .quality/types.log
          npm run security
          npm test | tee .quality/tests.log
      - name: Check every tracked Python source including tests
        run: |
          set -euo pipefail
          git ls-files -z '*.py' > .quality/python-files.bin
          mapfile -d '' sources < .quality/python-files.bin
          test "${#sources[@]}" -gt 0
          sha256sum "${sources[@]}" requirements-quality.txt > .quality/python-source-sha256.txt
          .venv/bin/python -m ruff check "${sources[@]}"
          .venv/bin/python -m ruff format --check "${sources[@]}"
          .venv/bin/python -m mypy "${sources[@]}" | tee .quality/python-types.log
          .venv/bin/python -m bandit --ignore-nosec -f json -o .quality/python-security.json "${sources[@]}"
      - name: Audit all Node lock entries and every locked Python package
        run: |
          npm audit --json > .quality/npm-audit.json
          .venv/bin/python -m pip_audit --strict --require-hashes --disable-pip -r requirements-quality.txt --progress-spinner off -f json -o .quality/python-dependencies.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: website-quality-reports
          path: .quality/
          include-hidden-files: true
          if-no-files-found: error
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, accessibility, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html 404.html style.css app.js .nojekyll _site/
          cp -R assets reports schemas _site/
          test ! -f _site/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
